name: Phase 3 - CI/CD

on:
  push:
    branches:
      - main
    tags:
      - "v*.*.*"
    paths:
      - "phase3-advanced/**"
      - ".github/workflows/phase3-ci.yml"

  pull_request:
    branches:
      - main
    paths:
      - "phase3-advanced/**"
      - ".github/workflows/phase3-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: docker-mastery-demo

jobs:

  # ==========================================================
  # CI - Lint and Test
  # ==========================================================
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: phase3-advanced

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            phase3-advanced/requirements.txt
            phase3-advanced/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Run Flake8
        run: |
          flake8 app test_main.py

      - name: Run Pytest
        run: |
          pytest -v


  # ==========================================================
  # CD - Build, Security Scan and Push
  # ==========================================================
  build-scan-push:
    name: Build, Scan & Push
    runs-on: ubuntu-latest
    needs: lint-and-test

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      # ------------------------------------------------------
      # Docker Buildx
      # ------------------------------------------------------
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # ------------------------------------------------------
      # Docker image metadata
      # ------------------------------------------------------
      - name: Generate Docker image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
            type=ref,event=tag

      # ------------------------------------------------------
      # Build Docker image
      # ------------------------------------------------------
      - name: Build Docker image
        uses: docker/build-push-action@v6
        with:
          context: ./phase3-advanced
          file: ./phase3-advanced/Dockerfile
          load: true
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # ------------------------------------------------------
      # Verify Docker image
      # ------------------------------------------------------
      - name: Verify Docker image
        run: |
          docker image inspect ${{ env.IMAGE_NAME }}:${{ github.sha }}

      # ------------------------------------------------------
      # Trivy vulnerability scan
      # ------------------------------------------------------
      - name: Scan Docker image with Trivy
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          exit-code: "1"
          ignore-unfixed: true
          vuln-type: os,library
          severity: HIGH,CRITICAL

      # ------------------------------------------------------
      # Docker Hub login
      # ------------------------------------------------------
      - name: Log in to Docker Hub
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # ------------------------------------------------------
      # Tag image for Docker Hub
      # ------------------------------------------------------
      - name: Tag Docker image
        if: github.event_name == 'push'
        run: |
          DOCKERHUB_IMAGE="${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}"

          docker tag \
            "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
            "${DOCKERHUB_IMAGE}:sha-${GITHUB_SHA}"

          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            docker tag \
              "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              "${DOCKERHUB_IMAGE}:latest"
          fi

          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"

            docker tag \
              "${{ env.IMAGE_NAME }}:${{ github.sha }}" \
              "${DOCKERHUB_IMAGE}:${VERSION}"
          fi

      # ------------------------------------------------------
      # Push SHA image
      # ------------------------------------------------------
      - name: Push SHA image
        if: github.event_name == 'push'
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:sha-${GITHUB_SHA}"

      # ------------------------------------------------------
      # Push latest image
      # ------------------------------------------------------
      - name: Push latest image
        if: github.ref == 'refs/heads/main'
        run: |
          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:latest"

      # ------------------------------------------------------
      # Push version image
      # ------------------------------------------------------
      - name: Push version image
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"

          docker push \
            "${{ secrets.DOCKERHUB_USERNAME }}/${{ env.IMAGE_NAME }}:${VERSION}"
